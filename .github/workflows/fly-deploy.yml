# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  # Only after CI has passed on main. Deploying in parallel with the
  # gate means the gate is decoration: the release command runs the
  # migration, and a migration is the one thing here that cannot be
  # rolled back by redeploying.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
