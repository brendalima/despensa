# Fly.io. One machine is enough: one household, one pantry.
# Generated by `fly launch` and edited: the reasoning is the comments.
app = 'despensa-verdant-valley-8190'
primary_region = 'gru'

[build]
[deploy]
  # The migration runs once, before the new machines take traffic, and
  # never at startup: an API that migrates on boot migrates once per
  # machine and hides a broken schema behind a retry. The Dockerfile
  # uses CMD rather than ENTRYPOINT so this replaces the API instead of
  # being passed to it as an argument.
  release_command = '/app/migrate'

[env]
  APP_ENV = 'prod'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero. The webhook POST is what wakes the machine, and Meta
  # redelivers what a cold start was too slow for, so nothing is lost —
  # the idempotency claim is what makes that safe.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # /healthz, not /readyz: a sleeping database must not restart a
    # healthy machine. Readiness is a question a person asks.
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
